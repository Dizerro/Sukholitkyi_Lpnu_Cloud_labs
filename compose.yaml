services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notes -d notes']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine

  app:
    build: .
    ports:
      - '8000:8000'
    environment:
      DB_HOST: db
      DB_NAME: notes
      DB_USER: notes
      DB_PASSWORD: ${DB_PASSWORD:-devpass}
      REDIS_HOST: redis
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL: ${CACHE_TTL:-30}
      CACHE_INVALIDATE: ${CACHE_INVALIDATE:-false}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: